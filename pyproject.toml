[project]
name = "sentiment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=46.0.0",
    "dbutils>=3.1.2",
    "faiss-cpu>=1.14.3",
    "fastapi>=0.141.1",
    "grpcio-tools>=1.83.0",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "jinja2>=3.1.6",
    "mcp>=2.2.0",
    "numpy>=2.4.6",
    "openai>=2.52.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "playwright>=1.62.0",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "pymupdf>=1.28.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sentence-transformers>=5.6.1",
    "tenacity>=9.1.4",
    "torch>=2.13.0",
    "uvicorn>=0.52.1",
    "websocket-client>=1.9.0",
]

[project.scripts]
sentiment-mcp = "backend.mcp_server.server:main"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu/"
explicit = true

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]             # 让测试能 import backend
asyncio_mode = "auto"          # async 测试免装饰器
markers = ["fast", "slow", "integration"]  # fast=纯逻辑必跑;slow=重依赖晚跑;integration=真实测试库

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]       # 错误/未定义/未使用导入
ignore = [
    "E501",                    # 存量行太长(全库数百处)——分期收敛,暂不拦(新代码仍靠格式化/pyright)
    "E402",                    # config 类文件需先 setenv 再 import,属项目正常模式
]
