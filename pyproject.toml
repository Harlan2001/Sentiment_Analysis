[project]
name = "sentiment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbutils>=3.1.2",
    "faiss-cpu>=1.14.3",
    "fastapi>=0.141.1",
    "grpcio-tools>=1.83.0",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "jinja2>=3.1.6",
    "numpy>=2.4.6",
    "openai>=2.52.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "playwright>=1.62.0",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "pymupdf>=1.28.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sentence-transformers>=5.6.1",
    "tenacity>=9.1.4",
    "torch>=2.13.0",
    "uvicorn>=0.52.1",
    "websocket-client>=1.9.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu/"
explicit = true

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
