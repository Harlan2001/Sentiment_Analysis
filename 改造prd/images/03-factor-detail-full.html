<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>因子详情全局页面</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#07100e;color:#eaf1ee}body{overflow:hidden}
:root{--background:#07100e;--foreground:#eaf1ee;--card:#121a18;--card-foreground:#eaf1ee;--popover:#17211e;--popover-foreground:#eaf1ee;--primary:#e6ece9;--primary-foreground:#101614;--secondary:#1c2723;--secondary-foreground:#dfe7e3;--muted:#1a2421;--muted-foreground:#83928c;--accent:#26352f;--accent-foreground:#edf4f1;--destructive:#d66e67;--border:#2c3935;--input:#34433e;--ring:#64caaa;--viz-series-1:#61c7a7;--viz-series-2:#dc786e;--viz-series-3:#a994df;--viz-series-4:#5cb9d0}
button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:270px 1fr;height:100vh}.sidebar{background:#161918;border-right:1px solid #2b322f;padding:18px 14px;display:flex;flex-direction:column;overflow:hidden}.brand{display:flex;align-items:center;gap:10px;padding:3px 8px 17px}.brandmark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#68d0b2,#77a7e4 58%,#bc92dc);display:grid;place-items:center;color:#09100e;font-weight:800}.brand strong{font-size:17px}.brand small{display:block;color:#75837e}.new{height:44px;border:0;border-radius:10px;background:#f1f4f2;color:#101513;text-align:left;padding:0 15px;font-weight:700}.nav{display:grid;gap:4px;margin-top:14px}.navitem{height:42px;border-radius:9px;display:flex;align-items:center;gap:10px;padding:0 12px;color:#b7c1bd}.navitem.active{background:#29322f;color:#fff}.navicon{width:22px;text-align:center;color:#92a09b}.sidehead{display:flex;justify-content:space-between;color:#77857f;font-size:13px;margin:23px 8px 7px}.sideitem{padding:7px 10px;border-radius:7px;color:#b5c0bc;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sideitem.current{background:#26302d;color:#fff}.sidebottom{margin-top:auto;border-top:1px solid #2b322f;padding-top:10px}.user{display:flex;gap:9px;align-items:center;padding:7px}.avatar{width:29px;height:29px;border-radius:50%;background:#30413b;display:grid;place-items:center}.user small{display:block;color:#73817c}
.work{display:grid;grid-template-rows:68px 55px 1fr;min-width:0}.top{display:flex;align-items:center;gap:18px;padding:0 28px;border-bottom:1px solid var(--border);background:#0b1210}.top h1{font-size:20px;margin:0;white-space:nowrap}.globalsearch{height:40px;max-width:620px;flex:1;margin:0 auto;border:1px solid #35433e;border-radius:10px;color:#74837d;background:#121917;display:flex;align-items:center;padding:0 14px}.topbtns{display:flex;gap:8px}.topbtn{height:38px;border:1px solid #35433e;border-radius:9px;background:#121917;color:#cbd4d0;padding:0 13px}.topbtn.light{background:#eef2f0;color:#111614;font-weight:700}.tabs{display:flex;gap:28px;align-items:flex-end;padding:0 30px;border-bottom:1px solid var(--border);background:#09100e}.apptab{height:55px;display:flex;align-items:center;border-bottom:2px solid transparent;color:#879690;font-size:14px}.apptab.active{border-bottom-color:#62c8a8;color:#fff}.content{overflow:auto;padding:22px 30px 30px}.content-inner{max-width:1260px;margin:0 auto}
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:10px;padding:14px}.btn{min-height:34px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--foreground);padding:7px 11px;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover,.btn.is-selected,.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-foreground)}.btn-primary{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}.btn-ghost{border-color:transparent}.form-label{display:grid;gap:5px;color:var(--muted-foreground);font-size:12px}.form-control,.form-select{height:37px;border:1px solid var(--input);border-radius:8px;background:#111816;color:var(--foreground);padding:0 10px}.viz-badge{display:inline-flex;align-items:center;border:1px solid var(--border);background:var(--muted);border-radius:999px;padding:4px 8px;font-size:11px}.viz-controls,.viz-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.viz-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.viz-stat{display:grid;gap:4px}.viz-stat-value{font-size:19px;font-weight:500}.table-responsive{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 9px;border-bottom:1px solid var(--border);font-size:12px;text-align:left}.table th{color:var(--muted-foreground);font-weight:500}.table-sm th,.table-sm td{padding:8px}.text-muted{color:var(--muted-foreground)}.text-small{font-size:11px}.text-end{text-align:right!important}.text-nowrap{white-space:nowrap}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}code{color:#8fa09a}</style></head><body>
<div class="app">

<div class="sidehead"><span>项目</span><span>＋⌄</span></div><div class="sideitem">▣ 国债策略研究</div><div class="sideitem">▣ 信用债跟踪</div>
<div class="sidehead"><span>对话</span><span>⌄</span></div><div class="sideitem">流动性对债市影响分析</div><div class="sideitem current">因子与宏观指标设计</div><div class="sideitem">本周利率债复盘</div><div class="sideitem">信用利差变化原因</div><div class="sideitem">央行政策解读</div>

<main class="work"><header class="top"><h1>研究资源与技能</h1><div class="globalsearch">⌕&nbsp;&nbsp;搜索因子、宏观指标或 Skill…</div><div class="topbtns"><button class="topbtn">通知</button><button class="topbtn light">分享</button></div></header>
<nav class="tabs"><div class="apptab active">因子库</div><div class="apptab">宏观指标</div><div class="apptab">Skills</div></nav>
<section class="content"><div class="content-inner"><div id="factor-detail-reference">
  <style>
    #factor-detail-reference { display: grid; gap: 14px; width: 100%; }
    #factor-detail-reference .fd-head,
    #factor-detail-reference .fd-title,
    #factor-detail-reference .fd-actions,
    #factor-detail-reference .fd-news-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    #factor-detail-reference .fd-head,
    #factor-detail-reference .fd-news-head { justify-content: space-between; }
    #factor-detail-reference .fd-stats { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; }
    #factor-detail-reference .fd-stat { padding: 12px; }
    #factor-detail-reference .fd-chart-wrap { display: grid; gap: 8px; }
    #factor-detail-reference .fd-chart { width: 100%; height: auto; overflow: visible; }
    #factor-detail-reference .fd-axis { stroke: var(--border); stroke-width: 1; }
    #factor-detail-reference .fd-grid { stroke: var(--border); stroke-width: 1; opacity: .55; }
    #factor-detail-reference .fd-positive { fill: var(--viz-series-1); }
    #factor-detail-reference .fd-negative { fill: var(--viz-series-2); }
    #factor-detail-reference .fd-neutral { fill: var(--muted-foreground); opacity: .55; }
    #factor-detail-reference .fd-label { fill: var(--muted-foreground); font-size: 11px; }
    #factor-detail-reference .fd-legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted-foreground); }
    #factor-detail-reference .fd-key { display: inline-flex; align-items: center; gap: 5px; }
    #factor-detail-reference .fd-swatch { width: 10px; height: 10px; display: inline-block; }
    #factor-detail-reference .fd-swatch.pos { background: var(--viz-series-1); }
    #factor-detail-reference .fd-swatch.neg { background: var(--viz-series-2); }
    #factor-detail-reference .fd-swatch.neu { background: var(--muted-foreground); }
    #factor-detail-reference .fd-news-list { display: grid; }
    #factor-detail-reference .fd-news { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: start; padding: 11px 0; border-bottom: 1px solid var(--border); }
    #factor-detail-reference .fd-news:last-child { border-bottom: 0; }
    #factor-detail-reference .fd-news-copy { display: grid; gap: 3px; }
    @media (max-width: 560px) {
      #factor-detail-reference .fd-stats { grid-template-columns: 1fr; }
      #factor-detail-reference .fd-news { grid-template-columns: auto minmax(0,1fr); }
      #factor-detail-reference .fd-news time { grid-column: 2; }
    }
  </style>

  <div class="fd-head">
    <div class="fd-title">
      <button type="button" class="btn btn-ghost" aria-label="返回因子库"><i data-lucide="arrow-left" aria-hidden="true"></i></button>
      <div>
        <strong>银行间流动性</strong>
        <div class="text-muted text-small"><code>LQ001</code> · 货币与流动性</div>
      </div>
      <span class="viz-badge">当前利多</span>
    </div>
    <button type="button" class="btn"><i data-lucide="star" aria-hidden="true"></i>关注</button>
  </div>

  <div class="fd-stats">
    <div class="card viz-stat fd-stat"><span class="text-muted">近7日事件</span><span class="viz-stat-value">18</span></div>
    <div class="card viz-stat fd-stat"><span class="text-muted">近30日事件</span><span class="viz-stat-value">46</span></div>
    <div class="card viz-stat fd-stat"><span class="text-muted">最后更新</span><span class="viz-stat-value">10:20</span></div>
  </div>

  <div class="fd-chart-wrap">
    <div class="fd-news-head">
      <strong>事件方向时间线</strong>
      <div class="fd-actions" role="group" aria-label="时间范围">
        <button type="button" class="btn" data-range="7">7日</button>
        <button type="button" class="btn is-selected" data-range="30" aria-pressed="true">30日</button>
        <button type="button" class="btn" data-range="90">90日</button>
        <button type="button" class="btn" data-range="365">1年</button>
      </div>
    </div>
    <svg class="fd-chart" viewBox="0 0 640 210" role="img" aria-labelledby="fd-chart-title fd-chart-desc">
      <title id="fd-chart-title">银行间流动性相关事件方向时间线</title>
      <desc id="fd-chart-desc">零轴以上是利多事件数量，零轴以下是利空事件数量，灰色圆点表示中性事件。</desc>
      <line class="fd-grid" x1="45" x2="620" y1="45" y2="45"></line>
      <line class="fd-grid" x1="45" x2="620" y1="90" y2="90"></line>
      <line class="fd-axis" x1="45" x2="620" y1="115" y2="115"></line>
      <line class="fd-grid" x1="45" x2="620" y1="160" y2="160"></line>
      <text class="fd-label" x="8" y="49">+4</text>
      <text class="fd-label" x="8" y="94">+2</text>
      <text class="fd-label" x="18" y="119">0</text>
      <text class="fd-label" x="8" y="164">-2</text>

      <rect class="fd-positive" x="70" y="70" width="24" height="45"></rect>
      <rect class="fd-negative" x="98" y="115" width="24" height="22"></rect>
      <circle class="fd-neutral" cx="110" cy="107" r="4"></circle>

      <rect class="fd-positive" x="150" y="92" width="24" height="23"></rect>
      <rect class="fd-negative" x="178" y="115" width="24" height="45"></rect>

      <circle class="fd-neutral" cx="350" cy="107" r="4"></circle>

      <rect class="fd-positive" x="390" y="25" width="24" height="90"></rect>
      <rect class="fd-negative" x="418" y="115" width="24" height="45"></rect>

      <text class="fd-label" x="69" y="191">07-07</text>
      <text class="fd-label" x="149" y="191">07-12</text>
      <text class="fd-label" x="229" y="191">07-17</text>

      <text class="fd-label" x="469" y="191">08-01</text>

    <div class="fd-legend text-small">
      <span class="fd-key"><span class="fd-swatch pos"></span>利多事件</span>
      <span class="fd-key"><span class="fd-swatch neg"></span>利空事件</span>

      <span id="fd-range-label">当前范围：近30日</span>
    </div>
  </div>

  <div class="fd-news-head">
    <strong>相关新闻</strong>
    <label class="form-label">方向
      <select class="form-select" id="fd-news-filter">
        <option value="all">全部</option>
        <option value="利多">利多</option>
        <option value="利空">利空</option>
        <option value="中性">中性</option>
      </select>
    </label>
  </div>
  <div class="card fd-news-list" id="fd-news-list"></div>

  <script>
    (() => {
      const root = document.getElementById('factor-detail-reference');
      const rangeButtons = Array.from(root.querySelectorAll('[data-range]'));
      const rangeLabel = root.querySelector('#fd-range-label');
      const filter = root.querySelector('#fd-news-filter');
      const list = root.querySelector('#fd-news-list');
      const news = [
        { direction:'利多', title:'央行连续开展逆回购操作，资金面保持宽松', source:'公开市场操作', time:'今天 09:35' },
        { direction:'利空', title:'地方债缴款规模上升，短期资金需求增加', source:'债券供需', time:'昨天 16:20' },
        { direction:'中性', title:'DR007 小幅波动，仍处政策利率附近', source:'资金价格', time:'昨天 11:10' }
      ];
      function renderNews() {
        const value = filter.value;
        const visible = news.filter(item => value === 'all' || item.direction === value);
        list.replaceChildren(...visible.map(item => {
          const row = document.createElement('div');
          row.className = 'fd-news';
          row.innerHTML = '<span class="viz-badge">' + item.direction + '</span><div class="fd-news-copy"><span>' + item.title + '</span><span class="text-muted text-small">' + item.source + '</span></div><time class="text-muted text-small">' + item.time + '</time>';
          return row;
        }));
      }
      rangeButtons.forEach(button => button.addEventListener('click', () => {
        rangeButtons.forEach(peer => {
          const active = peer === button;
          peer.classList.toggle('is-selected', active);
          peer.setAttribute('aria-pressed', String(active));
        });
        const labels = { '7':'近7日', '30':'近30日', '90':'近90日', '365':'近1年' };
        rangeLabel.textContent = '当前范围：' + labels[button.dataset.range];
      }));
      filter.addEventListener('change', renderNews);
      renderNews();
    })();
  </script>
