<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>现场互动 · 智驭债市 AI 固收研究助手</title>
<style>
  /* =============================================================
     调色板（dataviz reference palette）
     分类槽位：series 1..4 · 深/浅两套各自从档位取色
     ============================================================= */
  html{color-scheme:dark}
  html[data-theme="light"]{color-scheme:light}

  .app{
    --surface-1:#232322;        /* 卡片面 */
    --surface-2:#1a1a19;        /* 图表面 */
    --page:#0d0d0d;             /* 页面 */
    --ink-1:#ffffff;
    --ink-2:#c3c2b7;
    --ink-3:#898781;
    --line:#2c2c2a;
    --border:rgba(255,255,255,.10);
    --axis:#383835;
    --s1:#3987e5;  --s2:#d95926;  --s3:#199e70;  --s4:#c98500; /* dark 档 */
    --trkA:.18;                 /* 空轨道淡色浓度 */
    --good:#0ca30c;  --warn:#fab219;
  }
  @media (prefers-color-scheme: light){
    :root:where(:not([data-theme="dark"])) .app{
      color-scheme:light;
      --surface-1:#ffffff; --surface-2:#fcfcfb; --page:#f9f9f7;
      --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
      --line:#e1e0d9; --border:rgba(11,11,11,.10); --axis:#c3c2b7;
      --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; /* light 档 */
      --trkA:.12;
    }
  }
  html[data-theme="light"] .app{
    color-scheme:light;
    --surface-1:#ffffff; --surface-2:#fcfcfb; --page:#f9f9f7;
    --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
    --line:#e1e0d9; --border:rgba(11,11,11,.10); --axis:#c3c2b7;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --trkA:.14;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--page);color:var(--ink-1);
       font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       -webkit-font-smoothing:antialiased;overflow:hidden}
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit}

  /* =============================================================
     页面骨架
     ============================================================= */
  .app{height:100vh;display:flex;flex-direction:column;
       position:relative;overflow:hidden;
       background:
         radial-gradient(1200px 640px at 50% -18%, color-mix(in srgb, var(--s1) 16%, transparent), transparent 62%),
         radial-gradient(900px 520px at 88% 112%, color-mix(in srgb, var(--s3) 12%, transparent), transparent 60%),
         var(--page)}

  /* 顶部 HUD */
  .hud{display:flex;align-items:center;gap:22px;padding:22px 30px 14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px;font-size:14px;color:var(--ink-2);font-weight:600}
  .brand .bm{width:28px;height:28px;border-radius:8px;flex:none;
             background:linear-gradient(135deg,var(--s1),color-mix(in srgb,var(--s4) 70%,var(--s1)));
             display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
  .schemes{display:flex;gap:8px;flex-wrap:wrap}
  .schemes button{border:1px solid var(--border);background:var(--surface-1);color:var(--ink-2);
                  border-radius:999px;padding:7px 15px;font-size:13px;cursor:pointer;transition:.18s}
  .schemes button:hover{color:var(--ink-1);border-color:var(--ink-3)}
  .schemes button.on{color:var(--ink-1);border-color:transparent;font-weight:650;
                     background:color-mix(in srgb, var(--s1) 18%, var(--surface-1))}
  .total{margin-left:auto;display:flex;align-items:center;gap:12px;
         background:var(--surface-1);border:1px solid var(--border);border-radius:999px;padding:7px 18px}
  .total .tdot{width:9px;height:9px;border-radius:50%;background:var(--warn);flex:none;
               box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 22%,transparent)}
  .total .tdot.live{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .total b{font-size:22px;font-weight:700}
  .total span{font-size:12.5px;color:var(--ink-2)}
  .iconbtn{border:1px solid var(--border);background:var(--surface-1);color:var(--ink-2);
           width:34px;height:34px;border-radius:9px;cursor:pointer;display:inline-flex;
           align-items:center;justify-content:center;flex:none}

  /* 主舞台 */
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;
         justify-content:center;gap:38px;padding:10px 40px 26px;min-height:0}
  .qwrap{text-align:center;max-width:1080px}
  .q-tag{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:2px;
         color:var(--ink-3);text-transform:uppercase}
  .q-tag .dash{width:22px;height:1px;background:var(--ink-3)}
  h1{margin:16px 0 0;font-size:clamp(30px,4.4vw,58px);font-weight:720;letter-spacing:.5px;line-height:1.22}
  h1 .hl{color:var(--s1)}
  .q-sub{margin:14px auto 0;color:var(--ink-2);font-size:15px;max-width:620px;line-height:1.7}

  /* 选项区 */
  #rows{width:min(1040px,94vw);display:flex;flex-direction:column;gap:14px}
  .opt{display:grid;grid-template-columns:44px 26px auto 1fr;align-items:center;gap:18px;
       background:var(--surface-1);border:1px solid var(--border);border-radius:18px;
       padding:18px 26px;transition:opacity .18s, transform .18s, border-color .18s, box-shadow .18s}
  .opt .ic{width:26px;height:26px;flex:none;justify-self:center;display:flex;align-items:center;justify-content:center}
  .opt .ic svg{width:22px;height:22px}
  .opt .key{font-size:13px;font-weight:700;color:var(--ink-3);border:1px solid var(--line);
            border-radius:7px;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
  .opt.win .key{color:var(--ink-1);border-color:transparent;background:var(--warn)}
  .opt .name{font-size:clamp(18px,1.9vw,25px);font-weight:600;letter-spacing:.2px;white-space:nowrap}
  .track{position:relative;height:22px;border-radius:6px;
         background:color-mix(in srgb, var(--sni,#3987e5) var(--trkA), transparent);
         transition:background .2s}
  .track .fill{position:absolute;inset:0 auto 0 0;width:0%;border-radius:0 4px 4px 0; /* 数据端圆角 */
               background:var(--sni,#3987e5)}
  .track .val{position:absolute;top:50%;transform:translateY(-50%);padding:3px 9px;border-radius:6px;
              background:var(--surface-2);border:1px solid var(--border);
              font-size:16px;font-weight:650;white-space:nowrap;color:var(--ink-1);
              box-shadow:0 2px 10px rgba(0,0,0,.18)}
  .opt.win .track .val{color:#fff;background:var(--sni);border-color:transparent}
  .opt.lift{transform:scale(1.013);border-color:color-mix(in srgb,var(--sni) 45%,var(--border));
            box-shadow:0 18px 46px rgba(0,0,0,.32)}
  .opt.win .track{box-shadow:0 0 0 2px color-mix(in srgb,var(--sni) 55%,transparent),
                  0 0 42px color-mix(in srgb,var(--sni) 38%,transparent)}
  .opt:not(.is-up){opacity:.38}
  .opt .wincap{grid-column:5;grid-row:1;display:none;font-size:12px;font-weight:650;white-space:nowrap;
               color:var(--warn);align-items:center;gap:7px}
  .opt.win .wincap{display:inline-flex}
  .opt .val .pct{color:var(--ink-3);margin-left:6px;font-weight:600}
  .opt.win .val .pct{color:rgba(255,255,255,.78)}

  /* 发起按钮 */
  .cta{display:flex;flex-direction:column;align-items:center;gap:12px}
  #go{border:none;cursor:pointer;border-radius:999px;padding:18px 46px;font-size:20px;font-weight:700;
      color:#fff;letter-spacing:1px;
      background:linear-gradient(135deg,var(--s1),color-mix(in srgb,var(--s4) 60%,var(--s1)));
      box-shadow:0 14px 40px color-mix(in srgb,var(--s1) 34%,transparent);
      transition:transform .15s, opacity .15s}
  #go:hover{transform:translateY(-2px)}
  #go:disabled{opacity:.45;cursor:default;transform:none}
  .cta-hint{font-size:12px;color:var(--ink-3);letter-spacing:.3px}

  /* 底部演示者条 */
  .pbar{display:flex;align-items:center;gap:16px;padding:12px 30px;
        border-top:1px solid var(--border);background:color-mix(in srgb,var(--page) 78%,transparent);
        backdrop-filter:blur(6px);flex-wrap:wrap}
  .pbar .state{font-size:12.5px;font-weight:650;letter-spacing:.4px;display:flex;align-items:center;gap:9px;color:var(--ink-2)}
  .pbar .state .sdot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
  .pbar .state.up{color:var(--warn)} .pbar .state.up .sdot{background:var(--warn);animation:pulse 1.2s infinite}
  .pbar .state.done{color:var(--good)} .pbar .state.done .sdot{background:var(--good)}
  .script{flex:1;font-size:13.5px;color:var(--ink-3);min-width:240px;line-height:1.5;padding-left:16px;
          border-left:1px solid var(--border)}
  .script b{color:var(--ink-2);font-weight:650}
  .pbar details{font-size:12.5px;color:var(--ink-2)}
  .pbar summary{cursor:pointer;color:var(--ink-3);user-select:none}
  .pbar details[open] .panel{margin-top:10px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .panel{display:none}
  .panel label{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
  .panel input[type=range]{accent-color:var(--s1);width:140px}
  .panel select{background:var(--surface-1);color:var(--ink-1);border:1px solid var(--border);
                border-radius:8px;padding:4px 8px;font-size:12.5px}
  .keys{color:var(--ink-3);font-size:11.5px;white-space:nowrap}
  kbd{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;background:var(--surface-1);
      border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--ink-2)}

  @media (prefers-reduced-motion: reduce){
    .track .fill{transition:none}
    .opt{transition:none}
    .total .tdot.live{animation:none}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ============ 顶部 HUD ============ -->
  <header class="hud">
    <div class="brand">
      <span class="bm">智</span>
      <span>智驭债市 · AI 固收研究助手 <span style="color:var(--ink-3);font-weight:500">／ 现场互动</span></span>
    </div>

    <nav class="schemes" id="schemes"></nav>

    <div class="total" role="status">
      <span class="tdot" id="tdot"></span>
      <b class="num" id="totalNum">—</b>
      <span id="totalLbl">等待发起</span>
    </div>
    <button class="iconbtn" id="themeBtn" title="切换主题 (T)" aria-pressed="false" aria-label="切换主题"></button>
  </header>

  <!-- ============ 主舞台 ============ -->
  <main class="stage">
    <div class="qwrap">
      <span class="q-tag"><i class="dash"></i><span id="qtag">方案一 · 市场主线</span><i class="dash"></i></span>
      <h1 id="question"></h1>
      <p class="q-sub" id="qsub">全场单选 · 结果实时上屏，作为主持人衔接话术</p>
    </div>

    <section id="rows" aria-label="投票选项"></section>

    <div class="cta">
      <button id="go" type="button">发起投票</button>
      <span class="cta-hint">按空格键开始 · 数字键 1–3 切换方案 · H 收起提示</span>
    </div>
  </main>

  <!-- ============ 底部演示者条 ============ -->
  <footer class="pbar">
    <span class="state" id="state"><span class="sdot"></span><span id="stateTxt">待开始</span></span>
    <div class="script" id="script"><b>承接话术：</b><span id="scriptTxt">—</span></div>

    <details id="setup">
      <summary>演示设置</summary>
      <div class="panel">
        <label>总票数 <input type="range" id="cfgTotal" min="30" max="300" step="10"><output class="num" id="cfgTotalV">90</output></label>
        <label>时长 <input type="range" id="cfgDur" min="5" max="30" step="1"><output class="num" id="cfgDurV">12</output>s</label>
        <label>胜出项 <select id="cfgWin"></select></label>
        <label><input type="checkbox" id="cfgAuto"> 结束后自动重投</label>
      </div>
    </details>

    <span class="keys"><kbd>1</kbd>–<kbd>3</kbd> 方案 &nbsp; <kbd>Space</kbd> 开始 &nbsp; <kbd>←</kbd><kbd>→</kbd> 切方案 &nbsp; <kbd>T</kbd> 主题 &nbsp; <kbd>H</kbd> 提示</span>
  </footer>
</div>

<script>
(function(){
  'use strict';

  /* ============ 四个方案（与 docs/互动.md 一致） ============ */
  var SCHEMES = [
    { no:'方案一', tag:'市场主线', q:'下半年债市，您更认同哪条主线？',
      subs:'资产荒 / 供给放量 / 政策驱动',
      opts:[{id:'A',t:'资产荒持续'},{id:'B',t:'供给放量'},{id:'C',t:'政策驱动为主'}],
      winner:'A', weights:[.39,.32,.29],
      hint:'我们看到，大家更认同『资产荒持续』这条主线。' },
    { no:'方案二', tag:'决策维度', q:'做固收决策，您最常从哪个维度切入？',
      subs:'政策面 / 资金面 / 信用面 / 海外联动',
      opts:[{id:'A',t:'政策面'},{id:'B',t:'资金面'},{id:'C',t:'信用面'},{id:'D',t:'海外联动'}],
      winner:'B', weights:[.27,.32,.23,.18],
      hint:'大家最常从『资金面』入手——我们看 AI 如何从资金面切入。' },
    { no:'方案三', tag:'压力情景', q:'如果出现以下情景，您最担心哪一个？',
      subs:'流动性收紧 / 信用事件冒头 / 通胀反复',
      opts:[{id:'A',t:'流动性收紧'},{id:'B',t:'信用事件冒头'},{id:'C',t:'通胀反复'}],
      winner:'A', weights:[.39,.33,.28],
      hint:'大家最担心『流动性收紧』——看压力情景下 AI 靠不靠谱。' }
  ];

  /* ============ 状态 ============ */
  var sr = {
       phase:'idle',            // idle | voting | done
       scheme:0, counts:[], finals:[], total:0,
       el:null, raf:0, rt:0, startAt:0, optRows:[]
  };
  var cfg = { total:90, dur:12, winner:'default', auto:true };

  var $ = function(s){ return document.getElementById(s); };
  var elRow = $('rows'), elQ = $('question'), elQtag = $('qtag'), elSub = $('qsub'),
      elGo = $('go'), elTotalNum = $('totalNum'), elTotalLbl = $('totalLbl'), elTdot = $('tdot'),
      elSchemes = $('schemes'), elScript = $('scriptTxt'), elStateTxt = $('stateTxt'),
      elState = $('state'), elCfgWin = $('cfgWin');

  var STAR = '<svg viewBox="0 0 24 24" role="presentation"><path d="M12 2l2.9 6.2 6.8.7-5 4.5 1.4 6.7L12 17.3 5.9 20l1.4-6.7-5-4.5 6.8-.7z" fill="var(--warn)"/></svg>';
  var MOON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
  var SUN  = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M4 12H1M23 12h-3M12 4V1M12 23v-3M5.6 5.6 3.5 3.5M20.5 20.5l-2.1-2.1M5.6 18.4l-2.1 2.1M20.5 3.5l-2.1 2.1"/></svg>';

  /* ============ 搭建静态 DOM ============ */
  function buildMenu(){
    SCHEMES.forEach(function(sc, i){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = sc.no + ' · ' + sc.tag;
      b.addEventListener('click', function(){ selectScheme(i, true); });
      elSchemes.appendChild(b);
    });
  }
  function buildRows(){
    elRow.innerHTML = '';
    sr.optRows = [];
    SCHEMES[sr.scheme].opts.forEach(function(o, i){
      var row = document.createElement('div');
      row.className = 'opt';
      row.style.setProperty('--sni', 'var(--s' + (i + 1) + ')');
      row.setAttribute('role', 'listitem');
      row.innerHTML =
        '<div class="ic"></div>' +
        '<div class="key"></div>' +
        '<div class="name"></div>' +
        '<div class="track">' +
          '<div class="fill"></div>' +
          '<div class="val"><span class="cnt num">—</span><span class="pct"></span></div>' +
        '</div>' +
        '<div class="wincap">★ 多数认同</div>';
      row.querySelector('.key').textContent = o.id;
      row.querySelector('.name').textContent = o.t;
      sr.optRows.push(row);
      row.addEventListener('pointerenter', function(){ lift(true, i); });
      row.addEventListener('pointerleave', function(){ lift(false, i); });
      elRow.appendChild(row);
    });
  }
  function lift(on, i){
    if (sr.phase !== 'done' && sr.phase !== 'voting') return;
    sr.optRows.forEach(function(r, j){
      r.classList.toggle('lift', on && j === i);
      r.classList.toggle('is-up', on && j !== i);
    });
  }

  /* ============ 方案切换 ============ */
  function selectScheme(idx, fresh){
    sr.scheme = idx;
    buildRows();                      // 关键：每次切换按新方案重建选项区
    var sc = SCHEMES[idx];
    elQtag.textContent = sc.no + ' · ' + sc.tag;
    elQ.innerHTML = '';
    var parts = sc.q.split('？');
    elQ.appendChild(document.createTextNode(parts[0] + '？'));
    var hl = document.createElement('span'); hl.className = 'hl';
    hl.textContent = (parts[1] || '').trim();
    if (hl.textContent) elQ.appendChild(hl);
    elSub.textContent = parts[0] + '？' + (parts[1]||'').trim() + (sc.subs ? '  ·  ' + sc.subs : '  ·  全场单选');
    elScript.textContent = sc.hint;
    Array.prototype.forEach.call(elSchemes.children, function(b, i){
      b.classList.toggle('on', i === idx);
    });
    fillCfgWin();
    presetWinner();
    if (fresh) reset(true);
    else reset(false);
  }

  /* ============ 演示设置 ============ */
  function fillCfgWin(){
    var sc = SCHEMES[sr.scheme];
    elCfgWin.innerHTML = '';
    ['default'].concat(sc.opts.map(function(o){ return o.id; })).forEach(function(id){
      var op = document.createElement('option');
      op.value = id;
      op.textContent = id === 'default' ? ('默认 · ' + sc.winner + '（' + labelOf(sc.winner) + '）') : (id + ' · ' + labelOf(id));
      elCfgWin.appendChild(op);
    });
  }
  function labelOf(id){ var sc = SCHEMES[sr.scheme]; for (var i=0;i<sc.opts.length;i++) if (sc.opts[i].id===id) return sc.opts[i].t; return id; }
  function presetWinner(){ cfg.winner = 'default'; }
  function winnerIndex(){
    var sc = SCHEMES[sr.scheme], id = cfg.winner === 'default' ? sc.winner : cfg.winner;
    for (var i=0;i<sc.opts.length;i++) if (sc.opts[i].id===id) return i;
    return 0;
  }

  /* ============ 票数规划（胜出项确定性） ============ */
  function planFinals(){
    var sc = SCHEMES[sr.scheme];
    var n = sc.opts.length, raw = [];
    for (var i=0;i<n;i++) raw.push(Math.max(1, Math.round(sc.weights[i] * cfg.total)));
    var s = raw.reduce(function(a,b){ return a+b; }, 0);
    raw[0] += cfg.total - s;              // 校正总和 = 总票数
    var iw = winnerIndex();
    var imax = raw.indexOf(Math.max.apply(null, raw));
    if (imax !== iw){ raw[iw] = raw[imax] + 1; raw[imax] -= 1; } // 保证胜出项并列第一也拆掉
    return raw;
  }

  /* ============ 阶段渲染 ============ */
  function setPhase(p){
    sr.phase = p;
    elState.className = 'state';
    if (p === 'idle')      { elStateTxt.textContent = '待开始'; }
    else if (p === 'voting'){ elState.classList.add('up'); elStateTxt.textContent = '投票进行中'; }
    else                    { elState.classList.add('done'); elStateTxt.textContent = '已结束 · 承接演示'; }
  }
  function refresh(anim){
    var maxF = Math.max.apply(null, sr.finals);
    sr.optRows.forEach(function(row, i){
      var c = sr.counts[i], w = maxF ? (c / maxF) * 100 : 0;
      var fill = row.querySelector('.fill'), val = row.querySelector('.val'),
          cnt = row.querySelector('.cnt'), pct = row.querySelector('.pct');
      fill.style.width = w.toFixed(1) + '%';
      cnt.textContent = c || '0';
      var p = sr.total ? Math.round(c / sr.total * 100) : 0;
      pct.textContent = '· ' + p + '%';
      row.classList.toggle('win', sr.phase === 'done' && i === wi);
      var ic = row.querySelector('.ic');
      ic.innerHTML = (sr.phase === 'done' && i === wi) ? STAR : '';
      positionVal(row, val, w);
    });
    elTotalNum.textContent = sr.total || '—';
    if (anim) void 0;
  }
  function positionVal(row, val, w){
    var track = row.querySelector('.track'), tw = track.clientWidth, vw = val.offsetWidth;
    if (!tw) return;
    val.style.left = Math.min(tw - vw - 8, Math.max(8, tw * w / 100 + 8)) + 'px';
    val.style.opacity = '';
  }

  /* ============ 重置 / 发起 / 播放 ============ */
  function reset(fresh){
    if (sr.raf) cancelAnimationFrame(sr.raf);
    if (sr.rt) clearTimeout(sr.rt); sr.rt = 0;   // 清掉上一轮的"自动重投"，避免现场自行开始
    var n = SCHEMES[sr.scheme].opts.length;
    sr.counts = new Array(n).fill(0); sr.total = 0; sr.finals = new Array(n).fill(0);
    setPhase('idle');
    elGo.textContent = '发起投票'; elGo.disabled = false;
    elTdot.classList.remove('live');
    elTotalLbl.textContent = '等待发起';
    sr.optRows.forEach(function(row){ row.className = 'opt'; });
    refresh();
    if (fresh) clearFlourish();
  }
  function clearFlourish(){ sr.optRows.forEach(function(row){ row.classList.remove('win'); row.querySelector('.ic').innerHTML=''; }); }

  function start(){
    if (sr.phase === 'voting') return;
    reset(false);
    sr.phase = 'voting'; setPhase('voting');
    elGo.disabled = true; elGo.textContent = '投票进行中…';
    elTdot.classList.add('live'); elTotalLbl.textContent = '已回收';
    sr.finals = planFinals();
    sr.elapsed = 0; sr.startAt = performance.now();
    tick();
  }

  function tick(){
    var p = Math.min(1, (performance.now() - sr.startAt) / (cfg.dur * 1000));
    var target = Math.floor(sr.finals.reduce(function(a,b){return a+b;},0) * ease(p));
    while (sr.total < target){
      var i = pickAtom();
      if (i < 0) break;
      sr.counts[i]++; sr.total++;
    }
    refresh();
    if (p < 1){ sr.raf = requestAnimationFrame(tick); return; }
    finish();
  }
  function ease(t){ return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2; }

  function pickAtom(){
    var rem = [], S = 0;
    for (var i=0;i<sr.finals.length;i++){ var r = sr.finals[i]-sr.counts[i]; if (r>0){ rem.push([i,r]); S += r; } }
    if (!S) return -1;
    var roll = Math.random() * S, acc = 0;
    for (var k=0;k<rem.length;k++){ acc += rem[k][1]; if (roll < acc) return rem[k][0]; }
    return rem[rem.length-1][0];
  }

  var wi = 0;
  function finish(){
    wi = winnerIndex();
    sr.total = sr.finals.reduce(function(a,b){ return a+b; }, 0);
    sr.counts = sr.finals.slice();
    setPhase('done');
    refresh();
    elGo.disabled = false; elGo.textContent = '再投一次';
    elTdot.classList.remove('live'); elTotalLbl.textContent = '互动完成 · 承接话术如下';
    if (cfg.auto){ sr.rt = setTimeout(start, 3200); }
  }

  /* ============ 主题 ============ */
  function initTheme(){
    var f = function(){
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      elTheme.innerHTML = dark ? SUN : MOON;
      elTheme.setAttribute('aria-label', dark ? '切换到浅色' : '切换到深色');
    };
    elTheme.addEventListener('click', function(){
      document.documentElement.setAttribute('data-theme',
        document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      f();
    });
    f();
  }
  var elTheme = $('themeBtn');

  /* ============ 事件绑定 ============ */
  $('cfgTotal').addEventListener('input', function(){ cfg.total = +this.value; $('cfgTotalV').textContent = this.value; });
  $('cfgDur').addEventListener('input', function(){ cfg.dur = +this.value; $('cfgDurV').textContent = this.value; });
  $('cfgWin').addEventListener('change', function(){ cfg.winner = this.value; });
  $('cfgAuto').addEventListener('change', function(){ cfg.auto = this.checked; });

  document.addEventListener('keydown', function(e){
    if (e.key >= '1' && e.key <= '9'){
      var n = e.key.charCodeAt(0) - 49;
      if (n >= 0 && n < SCHEMES.length) selectScheme(n, true);
      return;
    }
    if (e.key === 'ArrowRight' || e.key === 'PageDown'){ selectScheme(Math.min(SCHEMES.length - 1, sr.scheme + 1), true); return; }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ selectScheme(Math.max(0, sr.scheme - 1), true); return; }
    if (e.key === ' ' || e.key === 'Enter'){
      if (sr.phase !== 'voting'){ e.preventDefault(); start(); }
      return;
    }
    if (e.key === 't' || e.key === 'T'){ elTheme.click(); return; }
    if (e.key === 'h' || e.key === 'H'){
      document.querySelector('.pbar').style.opacity =
        document.querySelector('.pbar').style.opacity === '0' ? '' : '0';
    }
  });
  elGo.addEventListener('click', start);

  var t0;
  window.addEventListener('resize', function(){ clearTimeout(t0); t0 = setTimeout(function(){ refresh(); }, 80); });

  /* ============ 启动 ============ */
  buildMenu();
  selectScheme(0, false);
  initTheme();
})();
</script>
</body>
</html>
