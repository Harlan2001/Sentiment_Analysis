# CI:PR 合并前的 4 道关卡(代码质量 → 单测 → 覆盖率 → 前端全链路)
#
# 后端:ruff + pytest(fast 档)+ 覆盖率(全局报告 + PR 增量 diff 覆盖率)
# 前端:typecheck + vitest + 生产构建
name: CI

on:
  pull_request:
    branches: [main, stable]
  push:
    branches: [main, stable]
  workflow_dispatch: # 手动触发,便于诊断与按需回归

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史,供 git diff 计算增量覆盖率
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: 安装依赖(uv sync 含 dev 组;CI 是开发环境,dev 就该在)
        run: uv sync --locked
      - name: Lint(ruff 全库)
        run: uv run ruff check backend tests

      - name: 单元测试 + 覆盖率(只跑 fast,排除集成;不碰真实 DB/外部模型)
        run: uv run pytest -m "not slow and not integration" --cov=backend --cov-report=term-missing:skip-covered --cov-report=xml

      - name: "PR 增量覆盖率(diff 门禁渐进: 新代码 <60% 拦截)"
        run: uv run python scripts/check_diff_coverage.py
        env:
          # PR 用 base 提交; push 到 main 用上一次提交。
          # 渐进式门禁: 60(现) → 70 → 80(+DIFF_COVERAGE_STRICT=1)。
          DIFF_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_COVERAGE_MIN: 60

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # vite 7 要求 >=20.19
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 单元测试
        run: npm run test
      - name: 生产构建
        run: npm run build

  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          # 只创建测试库; 生产库 Sentiment_analysis 不在此容器
          MYSQL_DATABASE: Sentiment_analysis_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: test
      MYSQL_DATABASE: Sentiment_analysis_test
      MYSQL_TEST_DATABASE: Sentiment_analysis_test
      LLM_API_KEY: ci-dummy-key
      LLM_BASE_URL: https://ci-dummy.example.com/v1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: 迁移测试库(重建 Sentiment_analysis_test; 脚本硬校验 *_test 后缀,不触生产库)
        run: uv run python scripts/migrate_test_db.py
      - name: 集成测试(真实 MySQL,LLM 用 respx mock)
        if: ${{ hashFiles('tests/integration/**') != '' }}
        run: uv run pytest tests/integration -m integration -q --cov=backend --cov-report=term-missing:skip-covered

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          # 只创建测试库; 生产库 Sentiment_analysis 不在此容器
          MYSQL_DATABASE: Sentiment_analysis_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: test
      MYSQL_DATABASE: Sentiment_analysis_test
      MYSQL_TEST_DATABASE: Sentiment_analysis_test
      LLM_API_KEY: ci-dummy-key
      LLM_BASE_URL: http://127.0.0.1:8080/v1 # e2e 里指向同 job 内 mock_llm_server
      OUTBOUND_PROXY_ENABLED: "false"
      AUTH_ENABLED: "false" # e2e 走免登录, 登录链路单独另测
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - name: 迁移测试库(migrate_test_db.py 只操作 *_test 库)
        run: uv run python scripts/migrate_test_db.py
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci
      - name: 安装 Playwright 浏览器
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E 测试(Playwright 拉起 backend+前端, 免登录)
        working-directory: frontend
        run: npm run e2e
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: 上传失败追踪
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true # 观察期: 先报告不门禁; 审核通过并转 gate 时去掉 continue-on-error
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks 需要完整历史
      - name: 后端依赖漏洞(pip-audit 扫 uv.lock 导出的 requirements)
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: |
          uv export --format requirements-txt --no-dev > backend-reqs.txt
          uvx pip-audit --requirement backend-reqs.txt
      - name: 前端依赖漏洞(npm audit)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true
      - name: 密钥泄露检测(gitleaks 全历史)
        run: |
          # 与 specific 版本绑定的 gitleaks 二进制(避免 action v2 的 license 依赖)
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks detect --source . --log-opts="--all" --report-format=json --report-path=/tmp/gitleaks-report.json
          echo "=== gitleaks 发现(0=干净) ==="
        continue-on-error: true
