	// 模板编号(UUID，可选，使用模板时提供）
	string template_id = 1;
	// 版本编号(UUID，可选，使用模板时提供，不填使用当前版本)
	string version_id = 2;
	// 代码（可选，直接提供代码时使用）
	string code = 3;
	// 参数
	repeated AiStrategyV2TemplateParameter params = 4;
	// 开始时间戳
	int64 begin_timestamp = 5;
	// 结束时间戳
	int64 end_timestamp = 6;
	// 初始资金
	double initial_capital = 7;
	// 手续费比例
	double commission_ratio = 8;
}


// 回测AI策略V2模板（返回消息）
message BacktestAiStrategyV2TemplateResponse
{
	// 返回信息
	ResponseInfo response_info = 1;
	// 日次绩效
	repeated AiStrategyV2DailyStats daily_stats = 2;
	// 区间绩效
	repeated AiStrategyV2PeriodStats period_stats = 3;
	// 权益曲线
	repeated AiStrategyV2EquityCurve1h equity_curve = 4;
	// 活动委托列表
	repeated AiStrategyV2Order orders = 5;
	// 活动持仓列表
	repeated AiStrategyV2Position positions = 6;
	// 成交列表
	repeated AiStrategyV2Trade trades = 7;
	// 跟踪消息
	repeated string traces = 8;
	// 回测控制台输出
	string backtest_log = 9;
	// 回测是否通过
	bool backtest_passed = 10;
	// 回测进程退出码
	int32 backtest_exit_code = 11;
}


