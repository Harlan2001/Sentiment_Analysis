////////////////////////////////////////////////////////////////////////////////
// 消息定义
////////////////////////////////////////////////////////////////////////////////


////////////////////////////////////////////////////////////////////////////////
// 策略消息定义
////////////////////////////////////////////////////////////////////////////////


// 策略数据描述
message StrategyDataDescription
{
	// 名称
	string name = 1;
	// 描述
	string desc = 2;
}


// 策略图表技术指标
message StrategyChartTechnical
{
	// 技术指标类型
	StrategyChartTechnicalType type = 1;
	// 数据
	repeated string data = 2;
	// 描述
	string desc = 3;
}


// 策略数据
message StrategyData
{
	// 名称
	string name = 1;
	// 数值
	repeated double values = 2;
}


// 策略绩效
message StrategyPerformance
{
	// 统计周期
	CandlePeriod period = 1;
	// 交易次数
	int32 trade_count = 2;
	// 胜次数
	int32 win_count = 3;
	// 败次数
	int32 lose_count = 4;
	// 胜率
	double win_rate = 5;
	// 累积收益
	double accumulated_profit = 6;
	// 最大累积收益
	double max_accumulated_profit = 7;
	// 最小累积收益
	double min_accumulated_profit = 8;
	// 胜收益
	double win_profit = 9;
	// 败收益
	double lose_profit = 10;
	// 收益比率
	double profit_rate = 11;
	// 最大回撤
	double max_drawdown = 12;
	// 最好单次收益
	double best_profit = 13;
	// 最差单次收益
	double worst_profit = 14;
	// 手续费（全部）
	double commission = 15;
	// 手续费（策略提供者）
	double provider_commission = 16;
	// 手续费（管理员）
	double manager_commission = 17;
	// 点差（全部）
	double spread = 18;
	// 点差（策略提供者）
	double provider_spread = 19;
	// 点差（管理员）
	double manager_spread = 20;
	// 浮动盈亏
	double float_profit = 21;
	// 累积收益（包含浮动盈亏）
	double accumulated_profit_float = 22;
	// 最大累积收益（包含浮动盈亏）
	double max_accumulated_profit_float = 23;
	// 最小累积收益（包含浮动盈亏）
	double min_accumulated_profit_float = 24;
	// 最大回撤（包含浮动盈亏）
	double max_drawdown_float = 25;
	// 开始时间
	int64 start_timestamp = 26;
	// 结束时间
	int64 end_timestamp = 27;
}


// 取策略收益列表请求项目
message GetStrategyProfitListRequestItem
{
	// 策略编号
	int32 strategy_id = 1;
	// 用户编号
	int32 user_id = 2;
}


// 取策略收益列表返回项目
message GetStrategyProfitListResponseItem
{
	// 策略编号
	int32 strategy_id = 1;
	// 用户编号
	int32 user_id = 2;
	// 商品键值
	CommodityKey key = 3;
	// 周期
	CandlePeriod period = 4;
	// 时间列表
	repeated int64 timestamps = 5;
	// 收益列表
	repeated double profits = 6;
	// 浮动收益列表
	repeated double float_profits = 7;
}


// 定阅策略信息请求项目
message SubscribeStrategyInfoRequestItem
{
	// 策略编号
	int32 strategy_id = 1;
	// 用户编号
	int32 user_id = 2;
}


////////////////////////////////////////////////////////////////////////////////
// AI助手消息定义
////////////////////////////////////////////////////////////////////////////////


// AI助手消息
message AssistentMessage
{
	// 角色
	AssistantRole role = 1;
	// 消息
	string message = 2;
}


////////////////////////////////////////////////////////////////////////////////
// AI策略V2消息定义
////////////////////////////////////////////////////////////////////////////////


// AI策略V2模板
message AiStrategyV2Template
{
	// 开放编号(UUID)
	string open_id = 1;
	// 当前版本编号(UUID)
	string current_version_id = 2;
	// 当前版本号(从1递增)
	int32 current_version_no = 3;
	// 名称
	string name = 4;
	// 描述
	string description = 5;
	// 代码
	string code = 6;
	// 创建时间
	int64 create_time = 7;
	// 更新时间
	int64 update_time = 8;
	// 回测控制台输出
	string backtest_log = 9;
	// 回测是否通过
	bool backtest_passed = 10;
	// 回测进程退出码（未退出或信号终止时为 -1）
	int32 backtest_exit_code = 11;
}


// AI策略V2模板历史
message AiStrategyV2TemplateHistory
{
	// 版本编号(UUID)
	string version_id = 1;
	// 版本号(从1递增)
	int32 version_no = 2;
	// 名称
	string name = 3;
	// 描述
	string description = 4;
	// 代码
	string code = 5;
	// 版本来源
	AiStrategyV2TemplateActionType action_type = 6;
	// 创建时间
	int64 create_time = 7;
	// 回测控制台输出（该版本）
	string backtest_log = 8;
	// 回测是否通过
	bool backtest_passed = 9;
	// 回测进程退出码
	int32 backtest_exit_code = 10;
}


// AI策略V2模板参数
message AiStrategyV2TemplateParameter
{
	// 名称
	string name = 1;
	// 数值
	string value = 2;
	// 类型
	AiStrategyV2TemplateParameterType type = 3;
}


// AI策略V2模板聊天会话
message AiStrategyV2TemplateChatSession
{
	// 开放编号(UUID)
	string open_id = 1;
	// 名称
	string name = 2;
}


// AI策略V2模板聊天消息
message AiStrategyV2TemplateChatMessage
{
	// 开放编号(UUID)
	string open_id = 1;
	// 时间戳（毫秒）
	int64 timestamp = 2;
	// 角色
	AiStrategyV2ChatRole role = 3;
	// 内容类型
	AiStrategyV2ChatContentType content_type = 4;
	// 内容
	string content = 5;
	// 当次消息使用的策略模板版本编号(UUID)
	string template_version_id = 6;
	// 当次消息使用的策略模板版本号(从1递增)
	int32 template_version_no = 7;
	// 策略生成状态（仅策略结果推送时有值）
	AiStrategyV2ChatStrategyGenerationStatus strategy_generation_status = 8;
	// 回测控制台输出（检查/完成阶段推送，供右侧面板展示）
	string backtest_log = 9;
	// 回测是否通过
	bool backtest_passed = 10;
	// 回测进程退出码
	int32 backtest_exit_code = 11;
	// 策略生成进度轨迹（生成中可多次推送；实现方约定为增量拼接或每次全量快照）
	string strategy_generation_trace = 12;
}


// AI策略V2实例
message AiStrategyV2
{
	// 开放编号(UUID)
	string open_id = 1;
	// 策略模板编号(UUID)
	string template_id = 2;
	// 版本编号(UUID)
	string version_id = 3;
	// 版本号(从1递增)
	int32 version_no = 4;
	// 名称
	string name = 5;
	// 描述
	string description = 6;
	// 代码
	string code = 7;
	// 参数
	string params = 8;
	// 阶段
	AiStrategyV2Stage stage = 9;
	// 状态
	AiStrategyV2Status status = 10;
	// 初始资金
	double initial_capital = 11;
	// 手续费比例
	double commission_ratio = 12;
	// 出错消息
	string error_message = 13;
	// 创建时间
	int64 create_time = 14;
	// 更新时间
	int64 update_time = 15;
}


// AI策略V2日次统计
message AiStrategyV2DailyStats
{
	// 交易日(YYYYMMDD)
	int32 trading_day = 1;
	// 日内交易次数
	int32 trade_count = 2;
	// 日内胜次数
	int32 win_count = 3;
	// 日内败次数
	int32 lose_count = 4;
	// 日内胜率
	double win_rate = 5;
	// 日内胜盈亏
	double win_pnl = 6;
	// 日内败盈亏
	double lose_pnl = 7;
	// 日内盈利因子
	double profit_factor = 8;
	// 日内最好单次盈亏
	double best_trade_pnl = 9;
	// 日内最差单次盈亏
	double worst_trade_pnl = 10;
	// 日内手续费
	double commission_fee = 11;
	// 日内未实现盈亏
	double unrealized_pnl = 12;
	// 日内已实现盈亏
	double realized_pnl = 13;
	// 日内最大已实现盈亏
	double realized_pnl_max = 14;
	// 日内最大已实现盈亏时间戳
	int64 realized_pnl_max_timestamp = 15;
	// 日内最小已实现盈亏
	double realized_pnl_min = 16;
	// 日内最小已实现盈亏时间戳
	int64 realized_pnl_min_timestamp = 17;
	// 日内总盈亏（已实现 + 未实现）
	double total_pnl = 18;
	// 日内最大总盈亏
	double total_pnl_max = 19;
	// 日内最大总盈亏时间戳
	int64 total_pnl_max_timestamp = 20;
	// 日内最小总盈亏
	double total_pnl_min = 21;
	// 日内最小总盈亏时间戳
	int64 total_pnl_min_timestamp = 22;
	// 日内最大已实现回撤
	double max_realized_drawdown = 23;
	// 日内最大已实现回撤时间戳
	int64 max_realized_drawdown_timestamp = 24;
	// 日内最大总回撤
	double max_total_drawdown = 25;
	// 日内最大总回撤时间戳
	int64 max_total_drawdown_timestamp = 26;
}


// AI策略V2区间统计
message AiStrategyV2PeriodStats
{
	// 统计周期
	AiStrategyV2StatsPeriod period = 1;
	// 区间交易次数
	int32 trade_count = 2;
	// 区间胜次数
	int32 win_count = 3;
	// 区间败次数
	int32 lose_count = 4;
	// 区间胜率
	double win_rate = 5;
	// 区间胜盈亏
	double win_pnl = 6;
	// 区间败盈亏
	double lose_pnl = 7;
	// 区间盈利因子
	double profit_factor = 8;
	// 区间最好单次盈亏
	double best_trade_pnl = 9;
	// 区间最差单次盈亏
	double worst_trade_pnl = 10;
	// 区间手续费
	double commission_fee = 11;
	// 区间未实现盈亏
	double unrealized_pnl = 12;
	// 区间已实现盈亏
	double realized_pnl = 13;
	// 区间总盈亏（已实现 + 未实现）
	double total_pnl = 14;
	// 区间最大已实现回撤
	double max_realized_drawdown = 15;
	// 区间最大已实现回撤时间戳
	int64 max_realized_drawdown_timestamp = 16;
	// 区间最大总回撤
	double max_total_drawdown = 17;
	// 区间最大总回撤时间戳
	int64 max_total_drawdown_timestamp = 18;
	// 区间开始时间戳（毫秒）
	int64 start_timestamp = 19;
	// 区间结束时间戳（毫秒）
	int64 end_timestamp = 20;
}


// AI策略V2权益曲线（1小时）
message AiStrategyV2EquityCurve1h
{
	// 小时结束时间戳（毫秒）
	int64 timestamp = 1;
	// 已实现盈亏
	double realized_pnl = 2;
	// 总盈亏（已实现 + 未实现）
	double total_pnl = 3;
	// 权益（初始资金 + 总盈亏）
	double equity = 4;
}


// AI策略V2委托
message AiStrategyV2Order
{
	// 开放编号(UUID)
	string open_id = 1;
	// 交易日(YYYYMMDD)
	int32 trading_day = 2;
	// 报单时间戳（毫秒）
	int64 create_timestamp = 3;
	// 更新时间戳（毫秒）
	int64 update_timestamp = 4;
	// 撤单时间戳（毫秒）
	int64 cancel_timestamp = 5;
	// 商品键值
	string commodity_key = 6;
	// 商品名称
	string commodity_name = 7;
	// 买卖方向
	AiStrategyV2Side side = 8;
	// 开平方向
	AiStrategyV2Offset offset = 9;
	// 委托类型
	AiStrategyV2OrderType order_type = 10;
	// 价格
	double price = 11;
	// 交易量
	double volume = 12;
	// 关联持仓编号(UUID)
	string position_id = 13;
	// 剩余交易量
	double remaining_volume = 14;
	// 保证金
	double margin = 15;
	// 剩余保证金
	double remaining_margin = 16;
	// 委托状态
	AiStrategyV2OrderStatus order_status = 17;
	// 备注
	string comment = 18;
	// 交易所委托编号
	string exchange_order_id = 19;
	// 自定义数据
	string custom_data = 20;
}


// AI策略V2持仓
message AiStrategyV2Position
{
	// 开放编号(UUID)
	string open_id = 1;
	// 交易日(YYYYMMDD)
	int32 trading_day = 2;
	// 创建时间戳（毫秒）
	int64 create_timestamp = 3;
	// 更新时间戳（毫秒）
	int64 update_timestamp = 4;
	// 商品键值
	string commodity_key = 5;
	// 商品名称
	string commodity_name = 6;
	// 买卖方向
	AiStrategyV2Side side = 7;
	// 持仓成本价
	double price = 8;
	// 交易量
	double volume = 9;
	// 剩余交易量
	double remaining_volume = 10;
	// 保证金
	double margin = 11;
	// 剩余保证金
	double remaining_margin = 12;
	// 未实现盈亏
	double unrealized_pnl = 13;
	// 已实现盈亏
	double realized_pnl = 14;
	// 持仓状态
	AiStrategyV2PositionStatus status = 15;
	// 备注
	string comment = 16;
	// 交易所持仓编号
	string exchange_position_id = 17;
	// 自定义数据
	string custom_data = 18;
}


// AI策略V2成交
message AiStrategyV2Trade
{
	// 开放编号(UUID)
	string open_id = 1;
	// 交易日(YYYYMMDD)
	int32 trading_day = 2;
	// 创建时间戳（毫秒）
	int64 create_timestamp = 3;
	// 商品键值
	string commodity_key = 4;
	// 商品名称
	string commodity_name = 5;
	// 买卖方向
	AiStrategyV2Side side = 6;
	// 开平方向
	AiStrategyV2Offset offset = 7;
	// 委托类型
	AiStrategyV2OrderType order_type = 8;
	// 成交价格
	double price = 9;
	// 交易量
	double volume = 10;
	// 关联委托编号(UUID)
	string order_id = 11;
	// 关联持仓编号(UUID)
	string position_id = 12;
	// 已实现盈亏
	double realized_pnl = 13;
	// 手续费
	double commission_fee = 14;
	// 备注
	string comment = 15;
	// 交易所成交编号
	string exchange_trade_id = 16;
	// 自定义数据
	string custom_data = 17;
}




