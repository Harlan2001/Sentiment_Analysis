////////////////////////////////////////////////////////////////////////////////
// 策略回测
////////////////////////////////////////////////////////////////////////////////


// 策略回测（请求消息）
message StrategyBacktestRequest
{
	// 商品键值
	CommodityKey key = 1;
	// 周期
	CandlePeriod period = 2;
	// 开始时间戳
	int64 begin_timestamp = 3;
	// 结束时间戳
	int64 end_timestamp = 4;
	// 策略内容
	string content = 5;
	// 时区
	int32 timezone_offset = 6;
	// 手续费（%）
	double commission_ratio = 7;
}


// 策略回测（返回消息）
message StrategyBacktestResponse
{
	// 返回信息
	ResponseInfo response_info = 1;
	// 商品键值
	CommodityKey key = 2;
	// 周期
	CandlePeriod period = 3;
	// 数据描述
	repeated StrategyDataDescription data_descriptions = 4;
	// 图表技术指标
	repeated StrategyChartTechnical chart_technicals = 5;
	// 策略数据
	repeated StrategyData datas = 6;
	// 策略绩效
	repeated StrategyPerformance performances = 7;
	// 数据精度
	int32 precision = 8;
	// 跟踪消息
	string trace = 9;
}


////////////////////////////////////////////////////////////////////////////////
// 变更策略执行状态
////////////////////////////////////////////////////////////////////////////////


// 变更策略执行状态（请求消息）
message ChangeStrategyExecutionStatusRequest
{
	// 执行状态
	StrategyExecutionStatus status = 1;
	// 策略编号
	int32 strategy_id = 2;
	// 用户编号
	int32 user_id = 3;
}


// 变更策略执行状态（返回消息）
message ChangeStrategyExecutionStatusResponse
{
	// 返回信息
	ResponseInfo response_info = 1;
}


