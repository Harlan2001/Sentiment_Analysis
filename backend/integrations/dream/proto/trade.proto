message GetAccountRankingResponse
{
	// 返回信息
	ResponseInfo response_info = 1;
	// 分组编号
	int32 group_id = 2;
	// 排序字段
	AccountSortField sort_by = 3;
	// 账户信息排名列表
	repeated AccountInfo account_infos = 4;
	// 交易账号排名
	int32 account_ranking = 5;
}


