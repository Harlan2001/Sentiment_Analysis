}


////////////////////////////////////////////////////////////////////////////////
// 取账户排名
////////////////////////////////////////////////////////////////////////////////


// 取账户排名（请求消息）
message GetAccountRankingRequest
{
	// 分组编号
	int32 group_id = 1;
	// 用户编号
	int32 user_id = 2;
	// 策略编号
	int32 strategy_id = 3;
	// 排序字段
	AccountSortField sort_by = 4;
