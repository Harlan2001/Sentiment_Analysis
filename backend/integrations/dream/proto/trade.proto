////////////////////////////////////////////////////////////////////////////////
// 取报单列表
////////////////////////////////////////////////////////////////////////////////


// 取报单列表（请求消息）
//
// 数量最小值为1，最大值为5000
//
// 开始时间戳、结束时间戳、数量组合使用说明：
// 不指定参数：取最新100条数据
// 数量（N）：取最新N条数据
// 开始时间戳：取开始时间戳之后（包含）的100条数据
// 结束时间戳：取结束时间戳之前（包含）的100条数据
// 开始时间戳 + 数量（N）：取开始时间戳之后（包含）的N条数据
// 结束时间戳 + 数量（N）：取结束时间戳之前（包含）的N条数据
// 开始时间戳 + 结束时间戳：取开始结束时间戳之间（包含）的数据，从结束时间戳向前最多返回5000条数据
// 开始时间戳 + 结束时间戳 + 数量（N）：取开始结束时间戳之间（包含）的数据，从结束时间戳向前最多返回N条数据
//
// 返回结果按时间戳升序排列
message GetOrderListRequest
{
	// 分组编号
	int32 group_id = 1;
	// 用户编号
	int32 user_id = 2;
	// 策略编号
	int32 strategy_id = 3;
	// 开始时间戳（可选）
	int64 begin_timestamp = 4;
	// 结束时间戳（可选）
	int64 end_timestamp = 5;
	// 数量（可选）
	int32 count = 6;
	// 商品键值（可选，只返回指定的商品数据）
	repeated CommodityKey keys = 7;
	// 开始位置（从0开始）
	int32 start_pos = 8;
	// 是否需要返回数据总数（可选）
	bool return_total_count = 9;
}


// 取报单列表（返回消息）
message GetOrderListResponse
{
	// 返回信息
	ResponseInfo response_info = 1;
	// 分组编号
	int32 group_id = 2;
	// 用户编号
	int32 user_id = 3;
	// 策略编号
	int32 strategy_id = 4;
	// 开始时间戳（请求参数）
	int64 begin_timestamp = 5;
	// 结束时间戳（请求参数）
	int64 end_timestamp = 6;
	// 数量（请求参数）
	int32 count = 7;
	// 商品键值（请求参数）
	repeated CommodityKey keys = 8;
	// 报单列表
	repeated CommodityOrderData orders = 9;
	// 开始位置（请求参数）
	int32 start_pos = 10;
	// 数据总数（请求参数需要返回数据总数时有值）
	int32 total_count = 11;
}


////////////////////////////////////////////////////////////////////////////////
// 取持仓列表
////////////////////////////////////////////////////////////////////////////////


// 取持仓列表（请求消息）
message GetPositionListRequest
{
	// 分组编号
	int32 group_id = 1;
	// 用户编号
	int32 user_id = 2;
	// 策略编号
	int32 strategy_id = 3;
	// 商品键值（可选，只返回指定的商品数据）
	repeated CommodityKey keys = 4;
	// 数量（可选）
	int32 count = 5;
	// 开始位置（从0开始）
	int32 start_pos = 6;
	// 是否需要返回数据总数（可选）
	bool return_total_count = 7;
}


// 取持仓列表（返回消息）
message GetPositionListResponse
{
	// 返回信息
	ResponseInfo response_info = 1;
	// 分组编号
	int32 group_id = 2;
	// 用户编号
	int32 user_id = 3;
	// 策略编号
	int32 strategy_id = 4;
	// 商品键值（请求参数）
	repeated CommodityKey keys = 5;
	// 成交列表
	repeated CommodityPositionData positions = 6;
	// 数量（请求参数）
	int32 count = 7;
	// 开始位置（请求参数）
	int32 start_pos = 8;
	// 数据总数（请求参数需要返回数据总数时有值）
	int32 total_count = 9;
}


////////////////////////////////////////////////////////////////////////////////
// 取成交列表
////////////////////////////////////////////////////////////////////////////////


// 取成交列表（请求消息）
//
// 数量最小值为1，最大值为5000
//
// 开始时间戳、结束时间戳、数量组合使用说明：
// 不指定参数：取最新100条数据
// 数量（N）：取最新N条数据
// 开始时间戳：取开始时间戳之后（包含）的100条数据
// 结束时间戳：取结束时间戳之前（包含）的100条数据
// 开始时间戳 + 数量（N）：取开始时间戳之后（包含）的N条数据
// 结束时间戳 + 数量（N）：取结束时间戳之前（包含）的N条数据
// 开始时间戳 + 结束时间戳：取开始结束时间戳之间（包含）的数据，从结束时间戳向前最多返回5000条数据
// 开始时间戳 + 结束时间戳 + 数量（N）：取开始结束时间戳之间（包含）的数据，从结束时间戳向前最多返回N条数据
//
// 返回结果按时间戳升序排列
message GetTradeListRequest
{
	// 分组编号
	int32 group_id = 1;
	// 用户编号
	int32 user_id = 2;
	// 策略编号
	int32 strategy_id = 3;
	// 开始时间戳（可选）
	int64 begin_timestamp = 4;
	// 结束时间戳（可选）
	int64 end_timestamp = 5;
	// 数量（可选）
	int32 count = 6;
	// 商品键值（可选，只返回指定的商品数据）
	repeated CommodityKey keys = 7;
	// 开始位置（从0开始）
	int32 start_pos = 8;
	// 是否需要返回数据总数（可选）
	bool return_total_count = 9;
}


// 取成交列表（返回消息）
message GetTradeListResponse
{
	// 返回信息
	ResponseInfo response_info = 1;
	// 分组编号
	int32 group_id = 2;
	// 用户编号
	int32 user_id = 3;
	// 策略编号
	int32 strategy_id = 4;
	// 开始时间戳（请求参数）
	int64 begin_timestamp = 5;
	// 结束时间戳（请求参数）
	int64 end_timestamp = 6;
	// 数量（请求参数）
	int32 count = 7;
	// 商品键值（请求参数）
	repeated CommodityKey keys = 8;
	// 成交列表
	repeated CommodityTradeData trades = 9;
	// 开始位置（请求参数）
	int32 start_pos = 10;
	// 数据总数（请求参数需要返回数据总数时有值）
	int32 total_count = 11;
}


