////////////////////////////////////////////////////////////////////////////////
// 接口定义
////////////////////////////////////////////////////////////////////////////////


// 接口编码定义：协议类型(0) + 消息类型(0) + 商品类型(0) + 消息编号(000)
// 协议类型：请求/应答(1)，定阅/应答(2)，推送(3)，
// 消息类型：通用(1)，行情((2))，交易(3)，资讯(4)
// 商品类型：通用(1)，股票(2)，期货(3)，期权(4)，外汇(5)，现货(6)
// 消息编号：编号(001-999)
enum MarketInterface
{
	// 占位
	MI_UNKNOWN = 0;

	// 取商品信息
	MI_GET_COMMODITY_INFO = 121001;
	// 取商品列表
	MI_GET_COMMODITY_LIST = 121002;
	// 取商品K线数据
	MI_GET_CANDLE_DATA = 121003;
	// 取商品分时数据
	MI_GET_MINUTE_DATA = 121004;
	// 取商品成交明细数据
	MI_GET_TRADE_DETAIL_DATA = 121005;
	// 取商品Tick数据
	MI_GET_TICK_DATA = 121006;

	// 定阅商品Tick数据
	MI_SUBSCRIBE_TICK_DATA = 221001;
	// 取消定阅商品Tick数据
	MI_UNSUBSCRIBE_TICK_DATA = 221002;

	// 推送商品Tick数据
	MI_PUSH_TICK_DATA = 321001;
}



////////////////////////////////////////////////////////////////////////////////
// 取商品信息
////////////////////////////////////////////////////////////////////////////////


// 取商品信息（请求消息）
message GetCommodityInfoRequest
{
	// 市场分类
	MarketCategory category = 1;
	// 本地商品信息时间戳
	int64 timestamp = 2;
	// 商品键值（可选，只返回指定的商品数据）
	repeated CommodityKey keys = 3;
}


// 取商品信息（返回消息）
message GetCommodityInfoResponse
{
	// 返回信息
	ResponseInfo response_info = 1;
	// 市场分类
	MarketCategory category = 2;
	// 商品信息时间戳
	int64 timestamp = 3;
	// 商品信息列表
	repeated CommodityInfo infos = 4;
}


////////////////////////////////////////////////////////////////////////////////
// 取商品列表
////////////////////////////////////////////////////////////////////////////////


// 取商品列表（请求消息）
message GetCommodityListRequest
{
	// 市场分类
	MarketCategory category = 1;
	// 字段列表
	repeated CommodityListField fields = 2;
	// 排序字段
	CommodityListField sort_by = 3;
	// 排序方向
	SortDirection sort_direction = 4;
	// 开始位置（从0开始，包含）
	int32 start_pos = 5;
	// 结束位置（从0开始，不包含）（可选，不指定时返回从指定开始位置之后的所有数据）
	int32 end_pos = 6;
	// 是否需要返回数据总数（可选）
	bool return_total_count = 7;

	// 过滤条件：查询关键字（可选，在商品显示代码、商品名称、商品拼音简称中匹配）
	repeated string keywords = 8;
	// 过滤条件：商品键值（可选）
	repeated CommodityKey keys = 9;
	// 过滤条件：交易所代码（可选）
	repeated string exchange_codes = 10;

	// 过滤条件：股票类型（可选，股票专有）
	repeated StockType stock_types = 101;

	// 过滤条件：期货类型（可选，期货专有）
	repeated FutureType future_types = 201;
	// 过滤条件：产品代码（可选，期货专有）
	repeated string product_codes = 202;
	// 过滤条件：主力合约类型（可选，期货专有）
	repeated FutureMainType main_types = 203;
	// 过滤条件：是否只显示本时间段可交易合约（可选，期货专有）
	bool show_trading_product_only = 204;
}


// 取商品列表（返回消息）
message GetCommodityListResponse
{
	// 返回信息
	ResponseInfo response_info = 1;
	// 市场分类（请求参数）
	MarketCategory category = 2;
	// 字段列表（请求参数）
	repeated CommodityListField fields = 3;
	// 排序字段（请求参数）
	CommodityListField sort_by = 4;
	// 排序方向（请求参数）
	SortDirection sort_direction = 5;
	// 开始位置（请求参数）
	int32 start_pos = 6;
	// 结束位置（请求参数）
	int32 end_pos = 7;
	// 数据总数（请求参数需要返回数据总数时有值）
	int32 total_count = 8;
	// 数据列表
	repeated CommodityListItem items = 9;
}


////////////////////////////////////////////////////////////////////////////////
// 取商品K线数据
////////////////////////////////////////////////////////////////////////////////


// 取商品K线数据（请求消息）
//
// 数量最小值为1，最大值为5000
//
// 开始时间戳、结束时间戳、数量组合使用说明：
// 不指定参数：取最新100条数据
// 数量（N）：取最新N条数据
// 开始时间戳：取开始时间戳之后（包含）的100条数据
// 结束时间戳：取结束时间戳之前（包含）的100条数据
// 开始时间戳 + 数量（N）：取开始时间戳之后（包含）的N条数据
// 结束时间戳 + 数量（N）：取结束时间戳之前（包含）的N条数据
// 开始时间戳 + 结束时间戳：取开始结束时间戳之间（包含）的数据，从结束时间戳向前最多返回5000条数据
// 开始时间戳 + 结束时间戳 + 数量（N）：取开始结束时间戳之间（包含）的数据，从结束时间戳向前最多返回N条数据
//
// 返回结果按时间戳升序排列
message GetCandleDataRequest
{
	// 商品键值
	CommodityKey key = 1;
	// 周期
	CandlePeriod period = 2;
	// 复权类型（股票专用）（可选）
	CandleAdjustType adjust = 3;
	// 开始时间戳（可选）
	int64 begin_timestamp = 4;
	// 结束时间戳（可选）
	int64 end_timestamp = 5;
	// 数量（可选）
	int32 count = 6;
}


// 取商品K线数据（返回消息）
message GetCandleDataResponse
{
	// 返回信息
	ResponseInfo response_info = 1;
	// 商品键值
	CommodityKey key = 2;
	// 周期
	CandlePeriod period = 3;
	// 复权类型（股票专用）（请求参数）
	CandleAdjustType adjust = 4;
	// 开始时间戳（请求参数）
	int64 begin_timestamp = 5;
	// 结束时间戳（请求参数）
	int64 end_timestamp = 6;
	// 数量（请求参数）
	int32 count = 7;
	// K线列表
	repeated CommodityCandleData candles = 8;
}


////////////////////////////////////////////////////////////////////////////////
// 取商品分时数据
////////////////////////////////////////////////////////////////////////////////


// 取商品分时数据（请求消息）
//
// 日期：默认为最后交易日
// 天数：指定日期之前（包含）的天数，默认为1天，最大10天
// 开始时间戳：如果指定开始时间戳，只返回开始时间戳之后（包含）的数据
// 结束时间戳：如果指定结束时间戳，只返回结束时间戳之前（包含）的数据
//
// 返回结果按时间戳升序排列
message GetMinuteDataRequest
{
	// 商品键值
	CommodityKey key = 1;
	// 日期（YYYYMMDD）（可选）
	int32 date = 2;
	// 天数（可选）
	int32 day_count = 3;
	// 开始时间戳（可选）
	int64 begin_timestamp = 4;
	// 结束时间戳（可选）
	int64 end_timestamp = 5;
}


// 取商品分时数据（返回消息）
message GetMinuteDataResponse
{
	// 返回信息
	ResponseInfo response_info = 1;
	// 商品键值
	CommodityKey key = 2;
	// 日期（YYYYMMDD）
	int32 date = 3;
	// 天数（请求参数）
	int32 day_count = 4;
	// 开始时间戳（请求参数）
	int64 begin_timestamp = 5;
	// 结束时间戳（请求参数）
	int64 end_timestamp = 6;
	// 分时数据列表
	repeated CommodityMinuteData minutes = 7;
}


