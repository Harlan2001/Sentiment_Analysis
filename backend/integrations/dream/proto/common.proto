////////////////////////////////////////////////////////////////////////////////
// DreamServer通用接口定义
// 版本 1.0.1.6
// 最后更新日期 2019/04/22
////////////////////////////////////////////////////////////////////////////////


syntax = "proto3";

package bitfin.dreamserver.protobuf;


////////////////////////////////////////////////////////////////////////////////
// 数据定义
////////////////////////////////////////////////////////////////////////////////


// 返回代码
enum ResponseCode
{
	// 成功
	RC_SUCCESS = 0;
	// 错误
	RC_ERROR = 1;
}




////////////////////////////////////////////////////////////////////////////////
// 消息定义
////////////////////////////////////////////////////////////////////////////////


// 返回信息
message ResponseInfo
{
	// 返回代码
	ResponseCode code = 1;
	// 返回消息
	string message = 2;
}


// 空返回消息
message EmptyResponse
{
	// 返回信息
	ResponseInfo response_info = 1;
}


// 服务器信息数据
message ServerInfoData
{
	// 名称
	string name = 1;
	// 值
	string value = 2;
}




////////////////////////////////////////////////////////////////////////////////
// 接口定义
////////////////////////////////////////////////////////////////////////////////


// 接口编码定义：协议类型(0) + 消息类型(0) + 消息编号(0000)
// 协议类型：请求/应答(1)，定阅/应答(2)，推送(3)，
// 消息类型：通用((1))，行情(2)，交易(3)，资讯(4)
// 消息编号：编号(0001-9999)
enum CommonInterface
{
	// 占位
	CI_UNKNOWN = 0;

	// 心跳
	CI_HEARTBEAT = 110001;
	// 测速
	CI_SPEED_TEST = 110002;
	// 登录
	CI_LOGIN = 110003;
	// 取服务器信息
	CI_GET_SERVER_INFO = 110004;

	// 推送会话密钥
	CI_PUSH_SESSION_KEY = 310001;
}


////////////////////////////////////////////////////////////////////////////////
// 登录
////////////////////////////////////////////////////////////////////////////////


// 登录（请求消息）
message LoginRequest
{
	// 访问凭证
	string access_token = 1;
}


// 登录（返回消息）
message LoginResponse
{
	// 返回信息
	ResponseInfo response_info = 1;
}


////////////////////////////////////////////////////////////////////////////////
// 取服务器信息
////////////////////////////////////////////////////////////////////////////////


// 取服务器信息（请求消息）
// 无


// 取服务器信息（返回消息）
message GetServerInfoResponse
{
	// 返回信息
	ResponseInfo response_info = 1;
	// 服务器信息数据
	repeated ServerInfoData items = 2;
}


////////////////////////////////////////////////////////////////////////////////
// 推送会话密钥
////////////////////////////////////////////////////////////////////////////////


// 推送会话密钥（推送消息）
message PushSessionKey
{
	// 会话密钥
	string session_key = 1;
}
