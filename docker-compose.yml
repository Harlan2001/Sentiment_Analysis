services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentiment-backend:latest
    container_name: sentiment-backend
    ports:
      - "8000:8000"
    environment:
      # ===== Python 运行时 =====
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      # ===== API前缀 =====
      - API_PREFIX=${API_PREFIX:-/sapi}
      # ===== Kingstar LLM API =====
      - kingstar_API_KEY=${kingstar_API_KEY}
      - kingstar_BASE_URL=${kingstar_BASE_URL}
      # ===== MySQL 数据库 =====
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-Sentiment_analysis}
      - MYSQL_CHARSET=${MYSQL_CHARSET:-utf8mb4}
      - MYSQL_AUTOCOMMIT=${MYSQL_AUTOCOMMIT:-true}
      # ===== 分析模型 =====
      - ANALYSIS_MODEL_NAME=${ANALYSIS_MODEL_NAME:-doubao}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # ===== 策略 & 标的推荐（必填，代码启动时校验） =====
      - QUANT_STRATEGY_BASE_URL=${QUANT_STRATEGY_BASE_URL}
      - QUANT_STRATEGY_TOKEN=${QUANT_STRATEGY_TOKEN}
      - STRATEGY_API_BASE_URL=${STRATEGY_API_BASE_URL}
      - BOND_API_BASE_URL=${BOND_API_BASE_URL}
      - KINGSTAR_EMPLOYEE_NO=${KINGSTAR_EMPLOYEE_NO}
      # ===== SaaS 本地快照模式 =====
      - USE_LOCAL_SNAPSHOT=${USE_LOCAL_SNAPSHOT:-false}
      - SNAPSHOT_DIR=${SNAPSHOT_DIR:-data/snapshots}
      # ===== 登录认证 =====
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS:-24}
      # ===== 飞书自建应用推送 =====
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - FEISHU_GROUP_ID=${FEISHU_GROUP_ID:-}
      # ===== 微信公众号推送 =====
      - WECHAT_APPID=${WECHAT_APPID:-}
      - WECHAT_USERNAME=${WECHAT_USERNAME:-}
      - WECHAT_PASSWORD=${WECHAT_PASSWORD:-}
      - ARTICLE_AUTHOR=${ARTICLE_AUTHOR:-AI量化系统}
      # ===== 网络代理 =====
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=frontend,backend,localhost,127.0.0.1,.local
      - no_proxy=frontend,backend,localhost,127.0.0.1,.local
      - OUTBOUND_PROXY_ENABLED=${OUTBOUND_PROXY_ENABLED:-true}
      # ===== uv 禁止缓存（runtime 不需要） =====
      - UV_NO_CACHE=1
    volumes:
      # 数据持久化：宿主机 data 目录映射到容器
      - ./data:/app/data
      # 日志目录
      - ./logs:/app/logs
      - ./models:/app/models
      # === 代码热替换：只传代码文件，不用重打镜像 ===
      - ./main.py:/app/main.py:ro
      - ./backend:/app/backend:ro
    networks:
      - sentiment-network
    restart: unless-stopped
    # 资源限制（根据服务器配置调整）
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    # 日志轮转配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: sentiment-frontend:latest
    container_name: sentiment-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sentiment-network
    restart: unless-stopped
    # 日志轮转配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  sentiment-network:
    driver: bridge
