services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentiment-backend:latest
    container_name: sentiment-backend
    ports:
      - "8000:8000"
    env_file:
      # 全量注入宿主机 .env（已被 gitignore，是唯一配置源）。
      # 缺省值由 backend/config/config.py 兜底（MYSQL_PORT / API_PREFIX / LOG_LEVEL / AUTH_ENABLED 等）。
      - .env
    environment:
      # 容器内固定配置：保持固定值，且优先级高于 env_file（不会被 .env 覆盖）
      - NO_PROXY=frontend,backend,localhost,127.0.0.1,.local
      - no_proxy=frontend,backend,localhost,127.0.0.1,.local
      # runtime 用不到 uv，禁止其缓存线程
      - UV_NO_CACHE=1
    volumes:
      # 数据持久化：宿主机目录映射到容器
      # ⚠️ bind mount 下容器内看到的是【宿主机】目录属主（镜像内 chown 不会穿透挂载）。
      #    Linux 宿主机请确保 ./data ./logs ./models 属主为 1000:1000（appuser），
      #    否则 appuser 写不进去（FAISS 索引、日志、模型缓存会报错）。
      - ./data:/app/data
      # 日志目录
      - ./logs:/app/logs
      - ./models:/app/models
      # === 代码热替换：只传代码文件，不用重打镜像 ===
      - ./main.py:/app/main.py:ro
      - ./backend:/app/backend:ro
    networks:
      - sentiment-network
    restart: unless-stopped
    # 资源限制（根据服务器配置调整）
    # ⚠️ deploy.resources.* 仅在 Swarm 模式（docker stack deploy）下生效，
    #    普通 docker compose up 会静默忽略。改用 service 顶层 cpus/mem_limit，
    #    确保 docker compose up 真正生效。
    cpus: '4'
    mem_limit: 8G
    mem_reservation: 4G
    # 日志轮转配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mcp:
    image: sentiment-backend:latest
    container_name: sentiment-mcp
    command: ["python", "-m", "backend.mcp_server.server"]
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      # MCP 与后端分别运行在不同容器内，必须通过 Compose 服务名访问后端。
      - SENTIMENT_INTERNAL_API_URL=http://backend:8000
      - NO_PROXY=frontend,backend,localhost,127.0.0.1,.local
      - no_proxy=frontend,backend,localhost,127.0.0.1,.local
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
      - ./backend:/app/backend:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sentiment-network
    restart: unless-stopped
    # 后端镜像自带的健康检查访问 8000；MCP 容器只监听 8002，因此禁用继承检查。
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: sentiment-frontend:latest
    container_name: sentiment-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sentiment-network
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    # 日志轮转配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  sentiment-network:
    driver: bridge
